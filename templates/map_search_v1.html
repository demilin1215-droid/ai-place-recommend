<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增收藏地點｜AI 地點推薦助手</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    <div class="page">
        <header>
            <div class="title">新增收藏地點</div>
            <div class="subtitle">
                使用 Google Map 搜尋地點，選取後可儲存到你的收藏清單。
            </div>
        </header>

        <input
            id="place-search"
            class="search-box"
            type="text"
            placeholder="搜尋地點，例如：台北咖啡廳、華山文創園區"
        >

        <div id="map"></div>

        <div class="info-box">
            <strong>已選取地點</strong><br>
            名稱：<span id="place-name">尚未選取</span><br>
            地址：<span id="place-address">尚未選取</span><br>
            緯度：<span id="place-lat">-</span><br>
            經度：<span id="place-lng">-</span>
        </div>

        <form action="/save_place" method="POST">
            <input type="hidden" id="name" name="name">
            <input type="hidden" id="address" name="address">
            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lng" name="lng">
            <input type="hidden" id="place_id" name="place_id">

            <button id="save-button" class="save-button" type="submit" disabled>
                儲存到收藏清單
            </button>
        </form>

        <div class="button-row">
            <a href="/" class="back-button">回首頁</a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/">首頁</a>
        <a href="/map_search" class="active">新增收藏</a>
        <a href="/recommend">推薦</a>
    </nav>

    <script>
        let map;
        let marker;
        let autocomplete;

        function initMap() {
            const defaultLocation = { lat: 25.033964, lng: 121.564468 };

            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 13
            });

            marker = new google.maps.Marker({
                map: map
            });

            const input = document.getElementById("place-search");

            autocomplete = new google.maps.places.Autocomplete(input, {
                fields: ["name", "formatted_address", "geometry", "place_id"]
            });

            autocomplete.addListener("place_changed", function () {
                const place = autocomplete.getPlace();

                if (!place.geometry || !place.geometry.location) {
                    alert("找不到這個地點的座標，請重新搜尋");
                    return;
                }

                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();

                map.setCenter({ lat: lat, lng: lng });
                map.setZoom(16);

                marker.setPosition({ lat: lat, lng: lng });

                document.getElementById("place-name").innerText = place.name || "";
                document.getElementById("place-address").innerText = place.formatted_address || "";
                document.getElementById("place-lat").innerText = lat;
                document.getElementById("place-lng").innerText = lng;

                document.getElementById("name").value = place.name || "";
                document.getElementById("address").value = place.formatted_address || "";
                document.getElementById("lat").value = lat;
                document.getElementById("lng").value = lng;
                document.getElementById("place_id").value = place.place_id || "";

                document.getElementById("save-button").disabled = false;
            });
        }
    </script>

    <script
        src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places&callback=initMap"
        async
        defer>
    </script>
</body>
</html>
